<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Canteen | Staff Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: #fff3e3;
            font-family: Arial, sans-serif;
        }

        .staff-login-page {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .staff-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .staff-icon {
            font-size: 45px;
            text-align: center;
            margin-bottom: 12px;
        }

        .staff-card h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .staff-card .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .staff-card label {
            display: block;
            margin: 15px 0 8px;
            font-weight: 600;
        }

        .staff-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            box-sizing: border-box;
        }

        .staff-card button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(100deg, #ff653b, #ff9e19);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #ffe5e5;
            color: #a40000;
            padding: 10px;
            border-radius: 8px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d94d25;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">🍔 Smart Canteen — Staff</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Student Login</a>
        </div>
    </nav>

    <section class="staff-login-page">
        <div class="staff-card">
            <div class="staff-icon">👨‍🍳</div>

            <h1>Staff Login</h1>
            <p class="subtitle">Sign in to manage canteen orders</p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('staff_login') }}">
                <label for="email">Staff Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter staff email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">Login to Staff Dashboard</button>
            </form>

            <a class="back-link" href="/">← Back to Home</a>
        </div>
    </section>
</body>
</html>
