
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Smart Canteen</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#172554,#334155);font-family:Arial;padding:20px}
.card{width:100%;max-width:410px;background:white;padding:35px;border-radius:18px;box-shadow:0 20px 60px #0003}
.logo{text-align:center;font-size:42px}
h1{text-align:center;margin-bottom:8px;color:#172554}
p{text-align:center;color:#718096}
label{display:block;margin:18px 0 7px;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #d5dae3;border-radius:9px}
button{width:100%;padding:14px;margin-top:24px;border:0;border-radius:9px;background:#ef6544;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.error{color:#dc2626;background:#fee2e2;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<div class="logo">🛡️</div>
<h1>Admin Login</h1>
<p>Smart Canteen Management System</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST" action="{{ url_for('admin_login') }}">
<label>Email Address</label>
<input type="email" name="email" placeholder="admin@smartcanteen.com" required>
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>
<button type="submit">Login to Admin Dashboard</button>
</form>
</div>
</body>
</html>
